<!doctype html>
<meta charset="utf-8">
<title>Krate CLI app in a tab</title>
<pre id="out"></pre>
<script type="module">
// A CLI-world Krate app (apps/krate-diceroll) on the browser's own engine.
// It never blocks, so it runs on the main thread with jco's sync mode.
import { ioHost, randomHost, GRANTS, instantiateApp } from './host.js';

const out = document.getElementById('out');
const report = (window.__krate = { path: 'jco-main', marks: {}, memories: [] });
const memories = [];
const imports = {
  ...ioHost({
    args: '5\n',
    grants: GRANTS.diceroll,
    onOutput(fd, text) {
      if (report.firstOutput === undefined) report.firstOutput = performance.now();
      out.textContent += text;
    },
  }),
  ...randomHost({ grants: GRANTS.diceroll }),
};
try {
  const app = await instantiateApp('../build/diceroll-sync', imports, memories, report.marks);
  const t = performance.now();
  report.exit = app.run();
  report.marks.run = performance.now() - t;
  report.output = out.textContent;
  report.memories = memories.map((m) => m.buffer.byteLength);
  report.done = performance.now();
} catch (e) {
  report.error = String(e && e.stack || e);
}
</script>
