[package]
name = "krate-adapter-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The browser Player's own module (IC-956 Phase 1): the `krate:ui` host a
# Krate app in a tab draws through, and the consent words and grants the
# tab decides with -- the desktop's own lowering, painter, manifest and
# policy crates, compiled to wasm32. CI builds it for wasm32 on every push
# (quick lane) so it cannot silently stop compiling again.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
krate-adapter-common = { path = "../adapter-common", features = ["vector-text"] }
krate-layout = { path = "../layout" }
krate-lowering = { path = "../lowering" }
krate-manifest = { path = "../manifest" }
krate-policy = { path = "../policy" }
serde.workspace = true
serde_json.workspace = true
# Only the pulley-in-a-tab probe needs the engine. IC-956 Phase 0 measured
# it against the browser's own engine (evidence/web-player), so it is
# opt-in: the Player module builds without wasmtime.
krate-runtime = { path = "../runtime", optional = true }

[features]
engine-probe = ["dep:krate-runtime"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["console"]
