[package]
name = "krate-web-transpile"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# The hub's publish step for the browser Player (IC-956 Phase 1): an
# app's component turned into what a tab runs -- its core modules plus
# JavaScript glue -- by the Bytecode Alliance's js-component-bindgen, the
# engine inside `jco transpile`, pinned to the version jco 1.35.0 ships.
# Compiled to wasm32 with no imports, like the validator, so the hub Worker
# runs it at publish: `scripts/build-hub-transpiler.sh`.
#
# Its own workspace, deliberately: js-component-bindgen brings its own
# wasmtime-environ (49) and wasm-tools (0.259), which have no business in
# the main workspace's lock file beside wasmtime 46.

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-component-bindgen = { version = "=2.12.0", default-features = false, features = ["transpile-bindgen"] }
wit-component = "=0.259.0"
wit-parser = "=0.259.0"
serde_json = "1"
sha2 = "0.10"
wasmparser = { version = "=0.259.0", default-features = false, features = ["std", "validate", "component-model", "features"] }

[dev-dependencies]
# Reading the test fixture's deflated entry; the same inflater crates/bundle
# uses.
miniz_oxide = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
