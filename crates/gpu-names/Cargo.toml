[package]
name = "krate-gpu-names"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "WebGPU's names for texture formats, vertex formats, features and limits, shared by Krate's GPU host and its guest wgpu backend."

# no_std so the guest backend (crates/wgpu-krate) links it into an app, and
# the same version of wgpu-types the host's wgpu uses, so a name maps to the
# same value on both sides of krate:gpu.
[dependencies]
wgt = { package = "wgpu-types", version = "29.0.4", default-features = false }
