# Build a binary to try before tagging anything.
#
# Three releases went out in one day and two of them were broken on Windows,
# because the only way to get a Windows binary was to cut a release. This does
# the same build and uploads it as an artifact, so a fix can be tested on the
# machine that found the bug before anyone tags it.
#
# Run it from the Actions tab, or: gh workflow run testbuild.yml -f target=...

name: Test build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which platform to build
        required: true
        default: aarch64-pc-windows-msvc
        type: choice
        options:
          - aarch64-pc-windows-msvc
          - x86_64-pc-windows-msvc
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu

jobs:
  build:
    name: ${{ inputs.target }}
    runs-on: >-
      ${{ contains(inputs.target, 'windows') && 'windows-latest'
       || contains(inputs.target, 'darwin') && 'macos-latest'
       || 'ubuntu-latest' }}
    # id-token and attestations: the build provenance step below signs a
    # statement about every file this run uploads (Sigstore, through GitHub).
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install the target
        shell: bash
        run: rustup target add ${{ inputs.target }}

      - name: Build
        shell: bash
        run: |
          # arm64 Windows and arm64 Linux build without speech-to-text, for the
          # same reason the release workflow does: whisper.cpp goes through
          # CMake and does not cross-compile to those targets from an x86_64
          # runner. Shipping everything else beats shipping nothing.
          args=()
          case "${{ inputs.target }}" in
            aarch64-pc-windows-msvc|aarch64-unknown-linux-gnu)
              args+=(--no-default-features)
              ;;
          esac
          cargo build --release -p krate-cli --target ${{ inputs.target }} "${args[@]}"

      # A real install places cargo-component beside krate, and Krate looks
      # for it there. Shipping only krate.exe made a test binary compile that
      # tool from source -- a problem the test build created, not the product.
      - name: Build cargo-component for this target
        shell: bash
        run: |
          cargo install cargo-component --locked --version 0.21.1 \
            --target ${{ inputs.target }} --root out-tool

      - name: Collect the binary
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ inputs.target }}" == *windows* ]]; then
            cp "target/${{ inputs.target }}/release/krate.exe" out/
          else
            cp "target/${{ inputs.target }}/release/krate" out/
          fi
          if [[ "${{ inputs.target }}" == *windows* ]]; then
            cp out-tool/bin/cargo-component.exe out/ 2>/dev/null || true
          else
            cp out-tool/bin/cargo-component out/ 2>/dev/null || true
          fi
          ls -la out

      # This lane is where the release's supply-chain files are proved,
      # because release.yml only runs on a tag and a tag is too late to find
      # out a new step is broken. The steps below are the same scripts the
      # release runs: an SBOM, the installer packages, and build provenance
      # for every file uploaded.
      #
      # The bill of materials (CycloneDX JSON) for exactly this build: the
      # crates the CLI links for this target with this lane's features (the
      # default set, so no speech-to-text), plus Studio's Rust shell and the
      # JavaScript bundled into its interface. Read from the lockfiles by
      # `cargo metadata` and npm; nothing is compiled for it.
      - name: Bill of materials (CycloneDX)
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --locked --version 0.5.7
          bash scripts/build-sbom.sh "${{ inputs.target }}" out --no-speech --studio

      # What an IT team deploys: a .pkg on macOS, a .deb and an .rpm on
      # Linux, from the binary built above. The .pkg is unsigned here (this
      # lane has no signing secrets) and its name ends in -unsigned to say so.
      - name: Installer packages (.pkg, .deb, .rpm)
        if: contains(inputs.target, 'darwin') || contains(inputs.target, 'linux')
        shell: bash
        run: |
          set -euo pipefail
          tool=()
          if [ -f out/cargo-component ]; then tool=(--tooling out/cargo-component); fi
          case "${{ inputs.target }}" in
            *darwin*)
              # The Player as the release assembles it, so the package is
              # the release's shape: CLI in /usr/local/bin, Player in
              # /Applications. Unsigned in this lane, like everything here.
              python3 -m pip install --quiet pillow || true
              KRATE_BINARY=out/krate scripts/make-macos-app.sh player-app
              bash scripts/build-org-packages.sh macos "${{ inputs.target }}" out/krate out \
                ${tool[@]+"${tool[@]}"} --player "player-app/Krate Player.app"
              ;;
            *linux*)
              bash scripts/build-org-packages.sh install-nfpm "$RUNNER_TEMP/bin"
              PATH="$RUNNER_TEMP/bin:$PATH" bash scripts/build-org-packages.sh linux \
                "${{ inputs.target }}" out/krate out ${tool[@]+"${tool[@]}"}
              # What each package installs, in the log.
              for f in out/*.deb; do dpkg-deb -c "$f"; dpkg-deb -I "$f"; done
              ;;
          esac
          ls -la out

      # Build provenance (SLSA, signed through GitHub's Sigstore instance)
      # for every file this run uploads, then checked the way a security
      # team would check a download: `gh attestation verify`.
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: The provenance verifies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in out/*; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" --repo "${{ github.repository }}" >/dev/null
            echo "verified: $(basename "$f")"
          done

      # Unsigned on purpose: this is for testing a fix, not for distribution.
      # Anything that reaches a user goes through the release workflow, which
      # signs and notarizes.
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: krate-test-${{ inputs.target }}
          path: out/*
          retention-days: 7
