[app]
id = "dev.krate.look-probe"
name = "Look"
version = "0.1.0"
entry = "target/wasm32-wasip1/release/krate_look_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A page that follows dark mode and your text size"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the look it read, for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
