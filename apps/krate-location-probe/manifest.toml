[app]
id = "dev.krate.location-probe"
name = "Where Am I"
version = "0.1.0"
entry = "target/wasm32-wasip1/release/krate_location_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A window to show where you are"
required = true

[[capabilities]]
cap = "location.read"
rationale = "Show your position on this screen; it is never sent anywhere"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the position, for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
