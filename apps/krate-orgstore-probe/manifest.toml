[app]
id = "dev.acme.orgstore-probe"
name = "orgstore-probe"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_orgstore_probe.wasm"
world = "krate:app/cli@0.1.0"

[[capabilities]]
cap = "io.stdout"
rationale = "Print what the organisation's store answered"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read which records to write, read or delete"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the team's records in the organisation's store"
required = true
