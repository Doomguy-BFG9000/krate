[app]
id = "dev.krate.motion-probe"
name = "Level"
version = "0.1.0"
entry = "target/wasm32-wasip1/release/krate_motion_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A window to show how the phone is held"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the reading, for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
