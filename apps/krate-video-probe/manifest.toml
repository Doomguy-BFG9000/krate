[app]
id = "dev.krate.video-probe"
name = "Clip"
version = "0.1.0"
entry = "target/wasm32-wasip1/release/krate_video_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A window that plays a short video with its controls"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report how playback went, for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true

