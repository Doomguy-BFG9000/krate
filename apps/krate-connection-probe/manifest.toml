[app]
id = "com.acme.connection-probe"
name = "connection-probe"
version = "0.1.0-dev"
entry = "target/wasm32-wasip1/release/krate_connection_probe.wasm"
world = "krate:app/cli@0.1.0"

[[capabilities]]
cap = "io.stdout"
rationale = "Print what the request answered"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read which request to make"
required = true

[[capabilities]]
cap = "net.connection:finance-api"
rationale = "Read invoices from the organisation's Finance API"
required = false
