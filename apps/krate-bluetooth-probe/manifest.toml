[app]
id = "dev.krate.bluetooth-probe"
name = "Heart"
version = "0.1.0"
entry = "target/wasm32-wasip1/release/krate_bluetooth_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A window to show your heart rate"
required = true

[[capabilities]]
cap = "bluetooth.connect"
rationale = "Read your heart rate from the monitor you pick"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report the reading, for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
