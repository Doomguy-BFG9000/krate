# Stock List: what the team has, how many, and what is running low (a starter an
# organisation releases in its first minute on Krate, IC-958). Its data is
# the team's, kept with store.org, and it asks for nothing else.

[app]
id = "dev.krate.stock-list"
name = "Stock List"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_stock_list.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's stock"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the stock list with your team, encrypted, so everyone counts the same things"
required = true
