[app]
id = "dev.krate.haptics-probe"
name = "Tap Back"
version = "0.1.0"
entry = "target/wasm32-wasip1/release/krate_haptics_probe.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "A window of buttons that tap back"
required = true

[[capabilities]]
cap = "io.stdout"
rationale = "Report whether this device can tap back, for automated runs"
required = true

[[capabilities]]
cap = "io.args"
rationale = "Read the quick-run flag used by automated tests"
required = true
