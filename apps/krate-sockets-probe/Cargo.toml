[package]
name = "krate-sockets-probe"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "TCP, UDP, name lookup and QUIC from inside a Krate app over krate:net/sockets (IC-935)."

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
net-krate = { path = "../../crates/net-krate", features = ["tokio", "quinn"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "io-util", "macros", "net", "sync"] }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
krate = { path = "../../crates/bindings-rust", features = ["std"] }
krate-c-runtime = { path = "../../crates/c-runtime" }
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[patch.crates-io]
# Made from the repo root by `python3 crates/net-krate/make-quinn.py patches`.
# make-quinn.py's copies: QUIC without std sockets (crates/net-krate/make-quinn.py).
quinn = { path = "../../patches/quinn-0.11.11" }
quinn-udp = { path = "../../patches/quinn-udp-0.5.14" }

[profile.release]
panic = "abort"
opt-level = 3
debug = false
