# Team Notes: notes the whole team shares (a starter an organisation
# releases in its first minute on Krate, IC-958). The reference for an
# organisation app: its data is the team's, kept with store.org, and it asks
# for nothing else.

[app]
id = "dev.krate.team-notes"
name = "Team Notes"
version = "1.0.0"
entry = "target/wasm32-wasip1/release/krate_team_notes.wasm"
world = "krate:app/gui@0.2.0"

[[capabilities]]
cap = "ui.window:create"
rationale = "Show your team's notes"
required = true

[[capabilities]]
cap = "store.org"
rationale = "Keep the notes with your team, encrypted, so everyone in it sees the same ones"
required = true
